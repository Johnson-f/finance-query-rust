[workspace]
members = [".", "finance-query-core"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.48.0", features = ["full"] }

# HTTP client
reqwest = { version = "0.12.24", features = ["cookies", "json", "gzip", "brotli"] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

# Date/time
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# HTML parsing
scraper = "0.24"

# Regex
regex = "1"

# Compression
flate2 = "1.0"

# Utilities
once_cell = "1"
url = "2.5"

# Logging
tracing = "0.1"

# Async utilities
futures-util = "0.3.31"
async-stream = "0.3"
tokio-stream = "0.1"

[package]
name = "finance-query-rust"
version = "0.2.1"
edition = "2024"

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
scraper = { workspace = true }
regex = { workspace = true }
flate2 = { workspace = true }
once_cell = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
futures-util = { workspace = true }
async-stream = { workspace = true }
tokio-stream = { workspace = true }

# Web framework (main app only)
actix-web = { version = "4", features = ["macros"] }
actix-cors = "0.7"
actix-ws = "0.3"
actix = "0.13"
tracing-actix-web = "0.7"
tracing-subscriber = "0.3"

# Redis caching (main app only)
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
dotenv = "0.15"

# GraphQL (main app only)
async-graphql = { version = "7", features = ["chrono", "chrono-tz"] }
async-graphql-actix-web = "7"

# Core crate
finance-query-core = { path = "finance-query-core" }
