# Production setup with Caddy for automatic HTTPS
# Caddy handles SSL certificates automatically via Let's Encrypt

services:
  caddy:
    image: caddy:latest
    container_name: tradstry-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3 support
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web
    depends_on:
      - backend

  backend:
    image: johnsonf/finance-query-rust:latest
    container_name: finance-query-rust
    restart: unless-stopped
    environment:
      # Redis configuration (optional)
      - REDIS_URL=${REDIS_URL:-}
      # Rate limiting
      - RATE_LIMIT_PER_DAY=${RATE_LIMIT_PER_DAY:-10000}
      # Proxy for Yahoo auth only (residential IP for crumb fetching)
      - AUTH_PROXY_URL=${AUTH_PROXY_URL:-}
      # Logging
      - RUST_LOG=${RUST_LOG:-info}
    networks:
      - web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  caddy_data:
  caddy_config:

networks:
  web:
    driver: bridge
